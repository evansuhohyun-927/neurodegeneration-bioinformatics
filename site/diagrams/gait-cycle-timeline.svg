<line class="d-line" x1="696.0" y1="236.0" x2="696.0" y2="278.0"/>
<text class="d-text d-strong" x="12.0" y="258.0" font-size="12" text-anchor="start">Whittle 사건</text>
<text class="d-sub" x="12.0" y="336.0" font-size="11.5" text-anchor="start">· 오른발 stance 62 % = 50 % + double stance 12 %. double stance가 0이 되면(stance 50 %) 걷기가 아니라 달리기다.</text>
<text class="d-sub" x="12.0" y="354.0" font-size="11.5" text-anchor="start">· 수치: Perry 82 m/min 평소 속도의 정상 평균([P] 1–2장). 사건 이름: Whittle([W] 2장). 환자는 %가 아니라 사건으로 다시 잡는다.</text>
<text class="d-sub" x="12.0" y="372.0" font-size="11.5" text-anchor="start">· 왼발은 오른발보다 반 주기(50 %) 늦게 같은 순서를 되풀이한다.</text>
