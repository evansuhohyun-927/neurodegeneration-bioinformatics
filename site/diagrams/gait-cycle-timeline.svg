<line class="d-line d-dash" x1="622.2" y1="34.0" x2="622.2" y2="236.0"/>
<line class="d-line d-dash" x1="696.0" y1="34.0" x2="696.0" y2="236.0"/>
<rect class="d-node" x="128.0" y="40.0" width="68.2" height="26.0" rx="4"/>
<text class="d-text d-strong" x="162.1" y="57.0" font-size="12" text-anchor="middle">WA</text>
<rect class="d-node" x="196.2" y="40.0" width="215.8" height="26.0" rx="4"/>
<text class="d-text d-strong" x="304.1" y="57.0" font-size="12" text-anchor="middle">SLS</text>
