<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="gait-cycle-timeline-t gait-cycle-timeline-d">
<title id="gait-cycle-timeline-t">보행 주기 시간표</title>
<desc id="gait-cycle-timeline-d">오른발의 initial contact에서 다음 initial contact까지를 0–100 %로 놓은 한 시간축 위에 다섯 줄을 겹쳤다. 맨 위는 Perry의 세 기능 과제: weight acceptance 0–12 %, single limb support 12–50 %, swing limb advancement 50–100 %(발이 아직 바닥에 있는 pre-swing 포함). 둘째 줄은 Perry 8 phase: IC 0–2, LR 2–12, MSt 12–31, TSt 31–50, PSw 50–62, ISw 62–75, MSw 75–87, TSw 87–100 %. 셋째 줄은 오른발로 0–62 %가 stance, 62–100 %가 swing. 넷째 줄은 반 주기 늦은 왼발로 50–100 %와 0–12 %가 stance, 12–50 %가 swing. 다섯째 줄은 두 발의 접지 상태로 0–12 %와 50–62 %가 double stance(두 발 접지), 12–50 %는 오른발만, 62–100 %는 왼발만 닿는다. 세로 점선은 Whittle의 사건이다: IC 0, opposite toe off 12, heel rise 31, opposite initial contact 50, toe off 62, feet adjacent 75, tibia vertical 87, 다음 IC 100 %. 수치는 Perry가 평소 속도 82 m/min에서 정리한 정상 평균이며, 환자에게는 퍼센트가 아니라 사건으로 경계를 다시 잡는다.</desc>
<text class="d-text d-strong" x="360.0" y="22.0" font-size="15" text-anchor="middle">보행 주기 시간표 — 오른발 IC부터 다음 IC까지 (%GC)</text>
