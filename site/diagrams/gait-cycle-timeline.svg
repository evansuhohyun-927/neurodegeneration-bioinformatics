<rect class="d-node" x="480.2" y="200.0" width="215.8" height="26.0" rx="3"/>
<text class="d-text" x="588.1" y="217.0" font-size="12" text-anchor="middle">왼발만 (왼 SLS)</text>
<text class="d-text d-strong" x="124.0" y="252.0" font-size="12" text-anchor="start">IC</text>
<text class="d-sub" x="124.0" y="267.0" font-size="10.5" text-anchor="start">발 닿음 0%</text>
<line class="d-line" x1="128.0" y1="236.0" x2="128.0" y2="240.0"/>
<text class="d-text d-strong" x="196.2" y="290.0" font-size="12" text-anchor="middle">OT</text>
<text class="d-sub" x="196.2" y="305.0" font-size="10.5" text-anchor="middle">반대 발 뜸 12%</text>
<line class="d-line" x1="196.2" y1="236.0" x2="196.2" y2="278.0"/>
<text class="d-text d-strong" x="304.1" y="252.0" font-size="12" text-anchor="middle">HR</text>
<text class="d-sub" x="304.1" y="267.0" font-size="10.5" text-anchor="middle">뒤꿈치 들림 31%</text>
<line class="d-line" x1="304.1" y1="236.0" x2="304.1" y2="240.0"/>
