<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="participant-hierarchy-t participant-hierarchy-d">
<title id="participant-hierarchy-t">참가자 단위 구조</title>
<desc id="participant-hierarchy-d">참가자 한 명(참가자 표의 한 줄)에 걷기 기록 파일이 여러 개 매달리고, 각 기록은 다시 2초 window 여러 개로 잘린다. 같은 사람에게서 나온 기록과 window는 서로 닮아 독립이 아니므로, 독립 단위는 참가자이고 검정의 n은 사람 수다.</desc>
<defs>
<marker id="participant-hierarchy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="d-text d-strong" x="91" y="30" font-size="14" text-anchor="middle">참가자</text>
<text class="d-text d-strong" x="295" y="30" font-size="14" text-anchor="middle">기록 (파일)</text>
<text class="d-text d-strong" x="560" y="30" font-size="14" text-anchor="middle">window (조각)</text>
<rect class="d-b" x="16" y="110" width="150" height="84" rx="8"/>
