<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="segment-joint-angles-t segment-joint-angles-d">
<title id="segment-joint-angles-t">분절각에서 관절각으로: Day I3의 마커 쌍과 부호 규약</title>
<desc id="segment-joint-angles-d">왼쪽은 오른쪽을 보고 걷는 사람의 오른 다리를 옆에서 본 막대 그림이다. 마커는 hip(대전자), knee(대퇴 외측 상과), fibula(비골두), ankle(외측 복사뼈), heel(뒤꿈치), mt5(제5중족골), toe(발끝)이고 toe는 오늘 쓰지 않는다. 분절마다 원위 마커에서 근위 마커로 향하는 화살표가 있다: 대퇴는 knee에서 hip으로, 하퇴는 ankle에서 fibula head로, 발은 mt5에서 heel로. 분절각은 이 화살표가 앞쪽 수평선(+x)과 이루는 각이며 반시계 방향이 +다. 그림의 자세는 대퇴 110°, 하퇴 90°, 발 180°로, 무릎 20° 굴곡, 발목 0°, 수직선 기준 대퇴(thigh) 각 20° 굴곡이 되어 Perry가 LR 끝에 제시하는 반올림 값과 같다. 오른쪽 상자에 식이 있다. 무릎 = 대퇴각 − 하퇴각(굴곡 +, 완전 신전 0°). 발목 = 발각 − 하퇴각 − 90°(배측굴곡 +, Winter 교재 부록 A.4와 같은 부호). thigh 각 = 대퇴각 − 90°(수직선 기준, 골반 마커가 없으므로 골반 기준 hip 각이 아니다). 같은 자세라도 Winter 교재 본문 3.6.2절의 발목 식(하퇴각 − 발각 + 90°)은 족저굴곡을 +로 두어 부호만 반대이고, BMC의 transformation_2d 노트북은 무릎 굴곡을 음수로 내며, 편 무릎을 180°로 부르는 사이각 표기도 있고, 왼쪽으로 걷는 영상에서는 분절각이 180° − θ가 되어 관절각 부호가 뒤집힌다. 맨 아래 띠는 숫자를 비교하기 전에 확인할 여섯 가지(축 이름, 마커 쌍, +의 방향, 0° 기준 자세, 걷는 방향, 2D인지 3D인지)다. 근거: Thomas, Zeni &amp; Winter 5판 3.6절과 부록 A, Robertson 등 2판 1장 pp.24–27, Perry &amp; Burnfield 2판 5–6장과 20장, BMC 노트북 kinematics_angular_2d·transformation_2d. 막대 길이와 마커 위치는 개념을 보이기 위한 단순화다.</desc>
<defs><marker id="segment-joint-angles-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="d-text d-strong" x="360.0" y="24.0" font-size="15" text-anchor="middle">분절각에서 관절각으로 — 이 레슨(Day I3)의 규약</text>
<text class="d-sub" x="360.0" y="42.0" font-size="12" text-anchor="middle">오른쪽을 보고 걷는 오른 다리를 옆에서 봄 · 화살표 = 원위 → 근위 벡터</text>
<rect class="d-node" x="10.0" y="54.0" width="290.0" height="432.0" rx="8"/>
<line class="d-line d-dash" x1="72.0" y1="66.0" x2="152.0" y2="66.0"/>
<text class="d-sub" x="156.0" y="70.0" font-size="10.5" text-anchor="start">골반 마커 없음</text>
<line class="d-line" x1="112.0" y1="92.0" x2="159.9" y2="223.6"/>
<line class="d-line" x1="159.9" y1="223.6" x2="159.9" y2="363.6"/>
<polygon class="d-b" points="159.9,363.6 137.9,389.6 217.9,389.6 241.9,389.6"/>
<line class="d-line d-bad" x1="141.0" y1="212.6" x2="104.7" y2="113.0" marker-end="url(#segment-joint-angles-arrow)"/>
<text class="d-text d-bad d-strong" x="58.9" y="170.8" font-size="12" text-anchor="start">θ_thigh</text>
<line class="d-line d-bad" x1="145.9" y1="349.2" x2="145.9" y2="258.3" marker-end="url(#segment-joint-angles-arrow)"/>
<text class="d-text d-bad d-strong" x="95.9" y="303.7" font-size="12" text-anchor="start">θ_leg</text>
<line class="d-line d-bad" x1="208.3" y1="416.6" x2="147.7" y2="416.6" marker-end="url(#segment-joint-angles-arrow)"/>
<text class="d-text d-bad d-strong" x="158.0" y="434.6" font-size="12" text-anchor="start">θ_foot</text>
<line class="d-line d-dash" x1="159.9" y1="223.6" x2="197.9" y2="223.6"/>
<path class="d-line" d="M183.9,223.6 A24,24 0 0 0 151.7,201.0" marker-end="url(#segment-joint-angles-arrow)"/>
<line class="d-line d-dash" x1="159.9" y1="363.6" x2="193.9" y2="363.6"/>
<path class="d-line" d="M179.9,363.6 A20,20 0 0 0 159.9,343.6" marker-end="url(#segment-joint-angles-arrow)"/>
<line class="d-line d-dash" x1="217.9" y1="389.6" x2="247.9" y2="389.6"/>
<path class="d-line" d="M233.9,389.6 A16,16 0 0 0 201.9,389.6" marker-end="url(#segment-joint-angles-arrow)"/>
<text class="d-sub" x="181.9" y="195.6" font-size="11" text-anchor="start">110°</text>
<text class="d-sub" x="179.9" y="343.6" font-size="11" text-anchor="start">90°</text>
<text class="d-sub" x="213.9" y="367.6" font-size="11" text-anchor="middle">180°</text>
<circle class="d-node d-good" cx="112.0" cy="92.0" r="4.5"/>
<text class="d-text" x="122.0" y="86.0" font-size="11" text-anchor="start">hip · 대전자</text>
<circle class="d-node d-good" cx="159.9" cy="223.6" r="4.5"/>
<text class="d-text" x="169.9" y="238.6" font-size="11" text-anchor="start">knee · 대퇴 외측 상과</text>
<circle class="d-node d-good" cx="159.9" cy="243.6" r="4.5"/>
<text class="d-text" x="169.9" y="271.6" font-size="11" text-anchor="start">fibula · 비골두</text>
<circle class="d-node d-good" cx="159.9" cy="363.6" r="4.5"/>
<text class="d-text" x="149.9" y="359.6" font-size="11" text-anchor="end">ankle · 외측 복사뼈</text>
<circle class="d-node d-good" cx="137.9" cy="389.6" r="4.5"/>
<text class="d-text" x="129.9" y="393.6" font-size="11" text-anchor="end">heel</text>
<circle class="d-node d-good" cx="217.9" cy="389.6" r="4.5"/>
<text class="d-text" x="221.9" y="407.6" font-size="11" text-anchor="end">mt5</text>
<circle class="d-node" cx="241.9" cy="389.6" r="4.5"/>
<text class="d-sub" x="235.9" y="407.6" font-size="11" text-anchor="start">toe(안 씀)</text>
<line class="d-line" x1="30.0" y1="474.0" x2="74.0" y2="474.0" marker-end="url(#segment-joint-angles-arrow)"/>
<text class="d-sub" x="78.0" y="478.0" font-size="10.5" text-anchor="start">x: 진행 방향(앞 +)</text>
<line class="d-line" x1="30.0" y1="474.0" x2="30.0" y2="440.0" marker-end="url(#segment-joint-angles-arrow)"/>
<text class="d-sub" x="34.0" y="438.0" font-size="10.5" text-anchor="start">y: 위 +</text>
<path class="d-line" d="M221.5,477.5 A11,11 0 1 0 205.7,471.8" marker-end="url(#segment-joint-angles-arrow)"/>
<text class="d-sub" x="232.0" y="472.0" font-size="10.5" text-anchor="start">반시계 +</text>
<rect class="d-node" x="312.0" y="54.0" width="398.0" height="108.0" rx="8"/>
<text class="d-text d-strong" x="324.0" y="74.0" font-size="13" text-anchor="start">① 분절각: 원위 → 근위 벡터가 +x와 이루는 각</text>
<text class="d-text" x="326.0" y="96.0" font-size="11.5" text-anchor="start">대퇴 θ_thigh: knee → hip</text>
<text class="d-text" x="326.0" y="115.0" font-size="11.5" text-anchor="start">하퇴 θ_leg: ankle → fibula head  (toe·knee 아님)</text>
<text class="d-text" x="326.0" y="134.0" font-size="11.5" text-anchor="start">발 θ_foot: mt5 → heel</text>
<text class="d-sub" x="326.0" y="153.0" font-size="11.5" text-anchor="start">계산: atan2(Δy, Δx) 다음 unwrap</text>
<rect class="d-a" x="312.0" y="170.0" width="398.0" height="128.0" rx="8"/>
<text class="d-text d-strong" x="324.0" y="190.0" font-size="13" text-anchor="start">② 관절각: 이웃한 분절각의 차</text>
<text class="d-text" x="326.0" y="212.0" font-size="11.5" text-anchor="start">무릎 = θ_thigh − θ_leg → 굴곡 +, 완전 신전 0°</text>
<text class="d-text" x="326.0" y="231.0" font-size="11.5" text-anchor="start">발목 = θ_foot − θ_leg − 90° → 배측굴곡 +</text>
<text class="d-sub" x="326.0" y="250.0" font-size="11.5" text-anchor="start">   (이 레슨 = [Wi] 부록 A.4와 같은 부호)</text>
<text class="d-text" x="326.0" y="269.0" font-size="11.5" text-anchor="start">thigh 각 = θ_thigh − 90° → 수직 기준, 굴곡 +</text>
<text class="d-sub" x="326.0" y="288.0" font-size="11.5" text-anchor="start">   (골반이 빠진 값: hip 각이 아니다)</text>
<rect class="d-c" x="312.0" y="306.0" width="398.0" height="128.0" rx="8"/>
<text class="d-text d-strong" x="324.0" y="326.0" font-size="13" text-anchor="start">③ 같은 자세, 다른 숫자</text>
<text class="d-text" x="326.0" y="348.0" font-size="11.5" text-anchor="start">[Wi] 본문 3.6.2 발목 = θ_leg − θ_foot + 90°: 족저굴곡 +</text>
<text class="d-text" x="326.0" y="367.0" font-size="11.5" text-anchor="start">BMC transformation_2d: 무릎 굴곡이 − 로 나옴</text>
<text class="d-text" x="326.0" y="386.0" font-size="11.5" text-anchor="start">사이각 표기: 편 무릎 ≈ 180° (임상식은 0°)</text>
<text class="d-text" x="326.0" y="405.0" font-size="11.5" text-anchor="start">왼쪽으로 걷는 영상: θ → 180° − θ, 관절각 부호 반전</text>
<text class="d-sub" x="326.0" y="424.0" font-size="11.5" text-anchor="start">부호 없는 사이각(arccos): 굴곡·과신전 구분 못 함</text>
<rect class="d-node" x="312.0" y="442.0" width="398.0" height="44.0" rx="8"/>
<text class="d-text d-strong" x="324.0" y="462.0" font-size="13" text-anchor="start">그림의 자세: 대퇴 110°, 하퇴 90°, 발 180°</text>
<text class="d-text" x="326.0" y="478.0" font-size="11.5" text-anchor="start">→ 무릎 20°, 발목 0°, thigh 각 20° (Perry LR 끝의 반올림 값)</text>
<rect class="d-d" x="10.0" y="496.0" width="700.0" height="52.0" rx="8"/>
<text class="d-text d-strong" x="360.0" y="516.0" font-size="12.5" text-anchor="middle">숫자를 비교하기 전에 확인할 것</text>
<text class="d-text" x="360.0" y="536.0" font-size="11.5" text-anchor="middle">축 이름(y 수직? z 수직?) · 마커 쌍 · +의 방향 · 0°의 기준 자세 · 걷는 방향 · 2D인지 3D인지</text>
</svg>
