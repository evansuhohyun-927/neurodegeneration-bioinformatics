<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="foot-rockers-t foot-rockers-d">
<title id="foot-rockers-t">네 rocker의 회전축과 Whittle의 세 rocker</title>
<desc id="foot-rockers-d">발 옆모습을 다각형(뒷발), 짧은 막대(발가락), 긴 막대(정강이)로 단순화해 stance 동안 회전축이 옮겨 가는 네 장면을 나란히 그렸다. 빨간 원이 그 장면의 회전축이고 둥근 화살표는 몸이 그 축 위로 앞으로 넘어가는 방향이다. ① heel rocker(LR, 0–12 %GC): 뒤꿈치의 둥근 아랫면이 축이고, 정강이 앞 근육이 원심성으로 발이 떨어지는 것을 늦추며 정강이를 앞으로 끈다. ② ankle rocker(MSt, 12–31 %): 발바닥이 바닥에 고정되고 발목 관절이 축이 되어 정강이가 앞으로 넘어간다. 가자미근이 원심성으로 그 속도를 늦춘다. 점선은 MSt 시작의 수직 정강이다. ③ forefoot rocker(TSt, 31–50 %): 뒤꿈치가 들리고 중족골두가 축이 된다. 몸이 지지면 앞으로 떨어지는 이 구간을 Perry는 주기 중 가장 강한 전진력으로 본다. 종아리 근육은 미는 것이 아니라 발목을 버티며 제동한다. ④ toe rocker(PSw, 50–62 %): 엄지발가락과 전족부 앞끝이 축이다. 팽팽하던 근건이 풀리며 되튀어 다리를 swing으로 보낸다. 아래 띠는 Whittle 6판의 세 rocker다: heel/initial rocker는 IC에서 OT까지, ankle/mid-stance rocker는 OT부터(본문은 terminal stance까지 이어진다고도 쓴다), forefoot/terminal rocker는 HR에서 TO까지라 Perry의 forefoot rocker와 toe rocker를 함께 담는다. 근거: Perry &amp; Burnfield 2판 3장 Foot Rockers, 4장; Whittle 6판 2장 pp.26–30. 발 모양과 각도는 개념을 보이기 위한 단순화이며 실제 비율이 아니다.</desc>
