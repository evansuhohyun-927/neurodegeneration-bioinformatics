<rect class="d-a" x="14.0" y="374" width="172.0" height="46" rx="8"/>
<text class="d-text d-strong" x="100.0" y="393.0" font-size="12" text-anchor="middle">heel / initial rocker</text>
<text class="d-text" x="100.0" y="410.0" font-size="10.5" text-anchor="middle">IC → OT</text>
<rect class="d-b" x="190.0" y="374" width="172.0" height="46" rx="8"/>
<text class="d-text d-strong" x="276.0" y="393.0" font-size="12" text-anchor="middle">ankle / mid-stance rocker</text>
<text class="d-text" x="276.0" y="410.0" font-size="10.5" text-anchor="middle">OT → HR (TSt까지 이어진다고도 씀)</text>
<rect class="d-c" x="366.0" y="374" width="348.0" height="46" rx="8"/>
<text class="d-text d-strong" x="540.0" y="393.0" font-size="12" text-anchor="middle">forefoot / terminal rocker</text>
<text class="d-text" x="540.0" y="410.0" font-size="10.5" text-anchor="middle">HR → TO · Perry의 ③과 ④를 한 묶음으로</text>
<text class="d-text" x="14.0" y="448.0" font-size="12" text-anchor="start">읽는 법: rocker는 모터가 아니라 경첩이다. Perry는 몸을 앞으로 보내는 주된 힘을 체중의 전방 낙하로 보고,</text>
<text class="d-text" x="14.0" y="466.0" font-size="12" text-anchor="start">rocker는 그 낙하를 앞쪽 회전으로 돌리는 축, stance 근육은 대부분 그 속도를 늦추는 브레이크로 본다.</text>
<text class="d-sub" x="14.0" y="488.0" font-size="11" text-anchor="start">근거: [P] 3장 Foot Rockers·4장, [W] 2장 pp.26–30. 발 모양·각도는 개념을 보이기 위한 단순화이며 실제 비율이 아니다.</text>
