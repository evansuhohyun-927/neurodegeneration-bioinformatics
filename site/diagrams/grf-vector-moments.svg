<text class="d-sub" x="582.0" y="492.0" font-size="11" text-anchor="start">가자미근·비복근</text>
<text class="d-text" x="360.0" y="528.0" font-size="12" text-anchor="middle">같은 순간을 Perry는 "벡터가 무릎 뒤 → 굴곡 요구", Winter는 "무릎 신전 모멘트"라고 부른다. 크기는 같고 방향(관점)만 반대다.</text>
<text class="d-sub" x="360.0" y="548.0" font-size="11" text-anchor="middle">벡터 근사는 관절 아래 분절의 무게·가속을 뺀다: 발목은 잘 맞고, 고관절과 swing에서는 틀린다([W] 2장 p.25).</text>
<text class="d-sub" x="360.0" y="566.0" font-size="11" text-anchor="middle">근육 이름은 정상 보행에서 흔한 담당일 뿐이다. 인대·관절낭·보조기도 같은 모멘트를 낼 수 있으니 EMG로 확인한다.</text>
<text class="d-sub" x="360.0" y="588.0" font-size="11" text-anchor="middle">자세·COP·기울기는 Perry 3·22장의 정성적 규칙에 맞춘 설명용 근사값 (오른쪽을 보고 걷는 오른 다리)</text>
</svg>
