<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="grf-vector-moments-t grf-vector-moments-d">
<title id="grf-vector-moments-t">GRF 벡터로 읽는 외부 모멘트와 내부 모멘트</title>
<desc id="grf-vector-moments-d">오른쪽을 보고 걷는 오른 다리를 옆에서 본 막대 그림 두 장면이다. 빨간 화살표는 바닥이 발을 미는 지면반력(GRF) 벡터이고 그 작용선을 점선으로 늘였다. 각 관절 중심에서 작용선으로 내린 초록 점선이 모멘트 팔이다. 왼쪽 ① LR 끝(약 12% GC)에는 압력중심(COP)이 뒤꿈치 쪽에 있고 벡터가 위로 갈수록 뒤로 기울어(제동) 고관절의 앞, 무릎의 뒤, 발목의 뒤를 지난다. 그래서 외부 모멘트(Perry·Whittle이 말하는 요구)는 고관절 굴곡, 무릎 굴곡, 발목 족저굴곡이고, 이를 버티는 내부 모멘트(Winter 곡선의 이름)는 고관절 신전(고관절 신전근), 무릎 신전(vastii), 발목 배측굴곡(전경골근이 원심성으로 발을 내림)이다. 오른쪽 ② TSt(약 45% GC)에는 뒤꿈치가 들리고 COP가 중족골두 아래로 옮겨 가며 벡터가 앞으로 기운다(추진). 벡터는 고관절의 뒤, 무릎의 앞, 발목의 앞을 지나고 발목의 모멘트 팔이 가장 길다. 외부 모멘트는 고관절 신전, 무릎 신전, 발목 배측굴곡이고 내부 모멘트는 고관절 굴곡(주로 앞쪽 인대의 수동 긴장), 무릎 굴곡(작음, 정렬로 안정), 발목 족저굴곡(가자미근·비복근)이다. 외부 모멘트 = GRF × 모멘트 팔이며, 정적 근사에서는 내부 모멘트가 크기는 같고 방향만 반대다. 이 근사는 관절 아래 분절의 무게와 가속을 빼므로 발목에서는 잘 맞고 고관절과 swing에서는 틀린다(Whittle 2장 p.25). 벡터 위치의 규칙은 Perry &amp; Burnfield 3장과 22장의 정성적 서술을 따랐고, 자세·각도·COP는 설명용 근사값이다.</desc>
<defs><marker id="grf-vector-moments-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="d-text d-strong" x="360.0" y="24.0" font-size="15" text-anchor="middle">GRF 벡터 하나로 세 관절의 모멘트 읽기 — 외부(요구)와 내부(반응)</text>
<text class="d-sub" x="360.0" y="44.0" font-size="12" text-anchor="middle">빨간 화살표 = 바닥이 발을 미는 힘 · 초록 점선 = 모멘트 팔 · 외부 모멘트 = GRF × 모멘트 팔</text>
