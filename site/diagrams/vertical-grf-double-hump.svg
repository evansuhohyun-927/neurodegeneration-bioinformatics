<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="vertical-grf-double-hump-t vertical-grf-double-hump-d">
<title id="vertical-grf-double-hump-t">수직 지면반력의 이중 봉우리와 phase</title>
<desc id="vertical-grf-double-hump-d">오른발 stance(0–62 % GC) 동안의 지면반력을 체중(BW) 단위로 그린 설명용 가상 곡선이다. 위 판은 수직 성분이다. initial contact 직후 1–2 % GC에 짧은 heel transient가 있을 수 있고(Perry 22장: 체중의 50–125 %, Whittle 2장: 10–20 ms, 빠른 응답의 장비라야 보이며 100 Hz 깔창에서는 한두 표본뿐), 이어 LR 끝 약 12 % GC에 첫 봉우리 F1(약 110 % BW), MSt의 골짜기 F2(약 80 % BW), TSt 후반 약 47 % GC 무렵의 둘째 봉우리 F3(약 110 % BW)가 오고 PSw에 빠르게 0으로 떨어진다. 이 수치는 Perry가 82 m/min 평소 속도에서 정리한 값이다. 점선은 약 60 m/min의 느린 걸음으로, 봉우리와 골짜기가 사라져 체중 높이의 고원이 된다. 가로 점선은 체중(1 BW)이다. 봉우리가 체중보다 큰 것은 질량중심이 위로 가속되기 때문이고(F = m(g + a)), 골짜기는 아래쪽 가속 때문이다. 아래 판은 전후 성분을 바닥이 발을 미는 힘(GRF) 기준으로 그린 것이다. stance 앞쪽은 음수(뒤쪽, 제동, Whittle의 F4), 뒤쪽은 양수(앞쪽, 추진, F5)이고 MSt 무렵 0을 지난다. 크기는 Perry 22장의 13 %와 23 % BW를 썼는데, Perry 본문은 발이 바닥을 미는 방향으로 적으므로 부호를 뒤집었다. 두 넓이(제동 충격량과 추진 충격량)가 같으면 걷는 속도가 유지된다. 맨 아래 막대는 Perry phase(IC 0–2, LR 2–12, MSt 12–31, TSt 31–50, PSw 50–62 % GC)다. gaitpdb의 깔창 센서는 수직 성분만 재므로 아래 판의 전후 성분과 COP는 그 자료로 얻을 수 없다.</desc>
<text class="d-text d-strong" x="360.0" y="24.0" font-size="15" text-anchor="middle">수직 지면반력의 이중 봉우리, 전후 성분, 그리고 phase</text>
<text class="d-sub" x="360.0" y="44.0" font-size="12" text-anchor="middle">설명용 가상 곡선 · 오른발 stance · 82 m/min 평소 속도의 대표 수치(Perry 22장) · 세로축은 체중(BW) 단위</text>
