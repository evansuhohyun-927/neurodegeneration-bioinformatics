<text class="d-text d-bad d-strong" x="614.0" y="256.0" font-size="12" text-anchor="start">thigh 각</text>
<text class="d-text d-bad d-strong" x="614.0" y="272.0" font-size="12" text-anchor="start">신전 20°</text>
<text class="d-text" x="596.0" y="310.0" font-size="11" text-anchor="middle">= 고관절 끝까지 신전</text>
<text class="d-text" x="596.0" y="327.0" font-size="11" text-anchor="middle">+ 골반 전방경사 증가 3–7°</text>
<text class="d-text" x="596.0" y="344.0" font-size="11" text-anchor="middle">+ 골반 후방 회전 약 5°</text>
<text class="d-sub" x="596.0" y="362.0" font-size="11" text-anchor="middle">hip 각으로는 신전 약 10°</text>
<rect class="d-d" x="10.0" y="384.0" width="700.0" height="86.0" rx="8"/>
<text class="d-text d-strong" x="360.0" y="404.0" font-size="12.5" text-anchor="middle">같은 걸음, 두 곡선 (Perry 6장, 5° 반올림)</text>
<text class="d-text" x="360.0" y="424.0" font-size="11.5" text-anchor="middle">thigh 각: IC 굴곡 20° → TSt 끝 신전 20° → MSw 굴곡 25°   ·   hip 각: 굴곡 30° → 신전 10° (범위 40°)</text>
<text class="d-text" x="360.0" y="443.0" font-size="11.5" text-anchor="middle">차이 ≈ 골반 전방경사 평균 약 10° — 걷는 동안 골반 경사가 몇 도 오르내리므로 차이도 상수가 아니다</text>
<text class="d-sub" x="360.0" y="461.0" font-size="11" text-anchor="middle">몸통을 숙이면 hip 각에만 굴곡으로 나타난다 · 허벅지 IMU가 재는 것은 thigh 각</text>
</svg>
