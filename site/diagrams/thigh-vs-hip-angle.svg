<text class="d-sub" x="659.8" y="134.4" font-size="10" text-anchor="middle">ASIS</text>
<line class="d-line d-dash" x1="606.0" y1="160.0" x2="606.0" y2="320.0"/>
<line class="d-line" x1="606.0" y1="160.0" x2="559.5" y2="287.8"/>
<circle class="d-node" cx="606.0" cy="160.0" r="5"/>
<circle class="d-node" cx="559.5" cy="287.8" r="5"/>
