<path class="d-line d-bad" d="M339.6,219.1 A60,60 0 0 0 370.5,216.4" marker-end="url(#thigh-vs-hip-angle-arrow)"/>
<text class="d-text d-bad d-strong" x="392.0" y="244.0" font-size="13" text-anchor="start">굴곡 30°</text>
<text class="d-text d-good" x="316.2" y="319.6" font-size="10.5" text-anchor="end">골반 기준선</text>
<text class="d-sub" x="360.0" y="344.0" font-size="11" text-anchor="middle">같은 허벅지가 약 10° 더 굽어 보인다</text>
<text class="d-sub" x="360.0" y="362.0" font-size="11" text-anchor="middle">(3D 장비가 흔히 보고하는 각)</text>
<rect class="d-c" x="482.0" y="54.0" width="228.0" height="320.0" rx="8"/>
<text class="d-text d-strong" x="596.0" y="76.0" font-size="13" text-anchor="middle">③ TSt 끝: 겉보기 과신전</text>
<text class="d-sub" x="596.0" y="94.0" font-size="11" text-anchor="middle">약 50 %GC</text>
<polygon class="d-node" points="565.2,126.4 655.8,142.4 606.0,160.0"/>
<line class="d-line" x1="565.2" y1="126.4" x2="655.8" y2="142.4"/>
