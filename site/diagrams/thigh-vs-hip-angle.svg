<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="thigh-vs-hip-angle-t thigh-vs-hip-angle-d">
<title id="thigh-vs-hip-angle-t">thigh 각과 hip 각: 같은 허벅지, 다른 기준</title>
<desc id="thigh-vs-hip-angle-d">세 칸에 오른쪽을 보고 걷는 사람의 골반과 허벅지를 옆에서 본 단순한 그림이 있다. 첫 칸은 thigh 각이다: 고관절을 지나는 수직 점선을 0°로 두고, 허벅지가 앞으로 20° 기울어 있으면 굴곡 20°다. Perry 본문이 쓰는 기준이며 골반 마커가 없는 Winter 자료로 계산할 수 있는 것도 이것이다. 둘째 칸은 같은 허벅지를 골반 기준으로 잰 hip 각이다: 뒤쪽 PSIS와 앞쪽 ASIS를 잇는 골반 선이 수평에서 앞으로 약 10° 숙어 있고(정상 기립의 평균), 골반에 붙은 기준선도 그만큼 뒤로 기울어 있어 같은 허벅지가 굴곡 30°로 측정된다. 3D 동작분석 장비가 흔히 보고하는 것이 이 각이다. 셋째 칸은 TSt 끝(약 50 %GC)의 겉보기 과신전이다: 허벅지가 수직선 뒤로 20° 넘어가 thigh 각은 신전 20°지만, 고관절만으로는 그만큼 펴지지 않고, 고관절의 끝까지 신전에 골반 전방경사 증가(3–7°)와 골반 후방 회전(약 5°)이 더해진 자세다. hip 각으로는 신전 약 10°다. 아래 띠: 같은 걸음에서 thigh 각은 IC 굴곡 20°, TSt 끝 신전 20°, MSw 최대 굴곡 25°이고 hip 각은 굴곡 30°에서 신전 10°까지(범위 40°)다. 두 각의 차이는 평균 약 10°의 골반 전방경사이며, 걷는 동안 골반 경사가 몇 도 변하므로 차이도 상수가 아니다. 근거: Perry &amp; Burnfield 2판 6장 Hip, 7장 Pelvis, 20장 Sagittal Plane Landmarks, Appendix A; Whittle 6판 2장 p.21. 그림의 비율과 골반 모양은 단순화다.</desc>
