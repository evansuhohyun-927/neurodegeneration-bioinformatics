<text class="d-sub" x="124.0" y="344.0" font-size="11" text-anchor="middle">골반 마커가 없어도 계산된다</text>
<text class="d-sub" x="124.0" y="362.0" font-size="11" text-anchor="middle">(WinterTableA1로 오늘 구하는 각)</text>
<rect class="d-a" x="246.0" y="54.0" width="228.0" height="320.0" rx="8"/>
<text class="d-text d-strong" x="360.0" y="76.0" font-size="13" text-anchor="middle">② hip 각 (골반 기준)</text>
<text class="d-sub" x="360.0" y="94.0" font-size="11" text-anchor="middle">기준 = 골반에 붙은 선</text>
<polygon class="d-node" points="309.2,126.4 399.8,142.4 350.0,160.0"/>
