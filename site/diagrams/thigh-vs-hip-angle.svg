<text class="d-sub" x="403.8" y="134.4" font-size="10" text-anchor="middle">ASIS</text>
<text class="d-sub" x="336.0" y="164.0" font-size="10.5" text-anchor="end">골반 선이</text>
<text class="d-sub" x="336.0" y="178.0" font-size="10.5" text-anchor="end">앞으로 10° 숙음</text>
<line class="d-line d-dash" x1="350.0" y1="160.0" x2="350.0" y2="320.0"/>
