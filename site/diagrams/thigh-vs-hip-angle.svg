<text class="d-sub" x="360.0" y="42.0" font-size="12" text-anchor="middle">오른쪽을 보고 걷는 사람 · 허벅지 굴곡 +</text>
<rect class="d-node" x="10.0" y="54.0" width="228.0" height="320.0" rx="8"/>
<text class="d-text d-strong" x="124.0" y="76.0" font-size="13" text-anchor="middle">① thigh 각 (Perry 본문)</text>
<text class="d-sub" x="124.0" y="94.0" font-size="11" text-anchor="middle">기준 = 수직선</text>
<line class="d-line d-dash" x1="114.0" y1="160.0" x2="114.0" y2="320.0"/>
