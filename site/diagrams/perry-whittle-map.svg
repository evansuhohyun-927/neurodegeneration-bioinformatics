<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" aria-labelledby="perry-whittle-map-t perry-whittle-map-d">
<title id="perry-whittle-map-t">Perry 8 phase ↔ Whittle 사건</title>
<desc id="perry-whittle-map-d">왼쪽은 Perry의 기능 구간 8개를 위에서 아래로 시간 순서대로 쌓은 것이고, 가운데 마름모는 Whittle이 경계로 쓰는 관찰 가능한 사건 7개(와 다음 주기의 IC), 오른쪽은 그 사건들 사이의 Whittle 구간 7개다. Perry phase의 끝 경계는 Whittle 사건과 하나씩 맞물린다: LR 끝 = opposite toe off, MSt 끝 = heel rise, TSt 끝 = opposite initial contact, PSw 끝 = toe off, ISw 끝 = feet adjacent, MSw 끝 = tibia vertical, TSw 끝 = 다음 initial contact. 단 하나 예외는 IC와 LR 사이 경계로, Whittle 쪽에는 대응하는 사건이 없다. Whittle은 IC를 순간으로 보므로 Perry의 IC와 LR이 Whittle에서는 loading response 한 구간이 되고, 그래서 Perry는 8개, Whittle은 7개 구간이다. 맨 왼쪽은 Perry의 세 기능 과제(WA = IC+LR, SLS = MSt+TSt, SLA = PSw+ISw+MSw+TSw), 맨 오른쪽은 stance(IC부터 toe off까지)와 swing(toe off부터 다음 IC까지)이다.</desc>
<text class="d-text d-strong" x="360.0" y="22.0" font-size="15" text-anchor="middle">Perry 8 phase ↔ Whittle 사건: 경계는 어디서 맞물리나</text>
<text class="d-sub" x="36.0" y="58.0" font-size="11" text-anchor="middle">과제</text>
<text class="d-text d-strong" x="155.0" y="58.0" font-size="12" text-anchor="middle">Perry phase (기능 구간)</text>
<text class="d-text d-strong" x="274.0" y="58.0" font-size="12" text-anchor="start">Whittle 사건 (경계가 되는 순간)</text>
<text class="d-text d-strong" x="585.0" y="58.0" font-size="12" text-anchor="middle">Whittle 구간</text>
<rect class="d-node" x="14.0" y="76.0" width="40.0" height="68.0" rx="6"/>
<text class="d-text d-strong" x="34.0" y="114.0" font-size="12" text-anchor="middle">WA</text>
<rect class="d-node" x="14.0" y="148.0" width="40.0" height="68.0" rx="6"/>
<text class="d-text d-strong" x="34.0" y="186.0" font-size="12" text-anchor="middle">SLS</text>
<rect class="d-node" x="14.0" y="220.0" width="40.0" height="140.0" rx="6"/>
<text class="d-text d-strong" x="34.0" y="294.0" font-size="12" text-anchor="middle">SLA</text>
<rect class="d-b" x="60.0" y="77.0" width="190.0" height="30.0" rx="4"/>
<text class="d-text d-strong" x="68.0" y="96.0" font-size="12" text-anchor="start">IC</text>
<text class="d-text" x="104.0" y="96.0" font-size="11.5" text-anchor="start">initial contact</text>
<text class="d-sub" x="244.0" y="96.0" font-size="11" text-anchor="end">0–2 %</text>
<rect class="d-b" x="60.0" y="113.0" width="190.0" height="30.0" rx="4"/>
<text class="d-text d-strong" x="68.0" y="132.0" font-size="12" text-anchor="start">LR</text>
<text class="d-text" x="104.0" y="132.0" font-size="11.5" text-anchor="start">loading response</text>
<text class="d-sub" x="244.0" y="132.0" font-size="11" text-anchor="end">2–12 %</text>
<rect class="d-b" x="60.0" y="149.0" width="190.0" height="30.0" rx="4"/>
<text class="d-text d-strong" x="68.0" y="168.0" font-size="12" text-anchor="start">MSt</text>
<text class="d-text" x="104.0" y="168.0" font-size="11.5" text-anchor="start">mid stance</text>
<text class="d-sub" x="244.0" y="168.0" font-size="11" text-anchor="end">12–31 %</text>
<rect class="d-b" x="60.0" y="185.0" width="190.0" height="30.0" rx="4"/>
<text class="d-text d-strong" x="68.0" y="204.0" font-size="12" text-anchor="start">TSt</text>
<text class="d-text" x="104.0" y="204.0" font-size="11.5" text-anchor="start">terminal stance</text>
<text class="d-sub" x="244.0" y="204.0" font-size="11" text-anchor="end">31–50 %</text>
<rect class="d-b" x="60.0" y="221.0" width="190.0" height="30.0" rx="4"/>
<text class="d-text d-strong" x="68.0" y="240.0" font-size="12" text-anchor="start">PSw</text>
<text class="d-text" x="104.0" y="240.0" font-size="11.5" text-anchor="start">pre-swing</text>
<text class="d-sub" x="244.0" y="240.0" font-size="11" text-anchor="end">50–62 %</text>
<rect class="d-c" x="60.0" y="257.0" width="190.0" height="30.0" rx="4"/>
<text class="d-text d-strong" x="68.0" y="276.0" font-size="12" text-anchor="start">ISw</text>
<text class="d-text" x="104.0" y="276.0" font-size="11.5" text-anchor="start">initial swing</text>
<text class="d-sub" x="244.0" y="276.0" font-size="11" text-anchor="end">62–75 %</text>
<rect class="d-c" x="60.0" y="293.0" width="190.0" height="30.0" rx="4"/>
<text class="d-text d-strong" x="68.0" y="312.0" font-size="12" text-anchor="start">MSw</text>
<text class="d-text" x="104.0" y="312.0" font-size="11.5" text-anchor="start">mid swing</text>
<text class="d-sub" x="244.0" y="312.0" font-size="11" text-anchor="end">75–87 %</text>
<rect class="d-c" x="60.0" y="329.0" width="190.0" height="30.0" rx="4"/>
<text class="d-text d-strong" x="68.0" y="348.0" font-size="12" text-anchor="start">TSw</text>
<text class="d-text" x="104.0" y="348.0" font-size="11.5" text-anchor="start">terminal swing</text>
<text class="d-sub" x="244.0" y="348.0" font-size="11" text-anchor="end">87–100 %</text>
<rect class="d-b" x="520.0" y="77.0" width="130.0" height="66.0" rx="4"/>
<text class="d-text" x="585.0" y="114.0" font-size="11.5" text-anchor="middle">loading response</text>
<rect class="d-b" x="520.0" y="149.0" width="130.0" height="30.0" rx="4"/>
<text class="d-text" x="585.0" y="168.0" font-size="11.5" text-anchor="middle">mid-stance</text>
<rect class="d-b" x="520.0" y="185.0" width="130.0" height="30.0" rx="4"/>
<text class="d-text" x="585.0" y="204.0" font-size="11.5" text-anchor="middle">terminal stance</text>
<rect class="d-b" x="520.0" y="221.0" width="130.0" height="30.0" rx="4"/>
<text class="d-text" x="585.0" y="240.0" font-size="11.5" text-anchor="middle">pre-swing</text>
<rect class="d-c" x="520.0" y="257.0" width="130.0" height="30.0" rx="4"/>
<text class="d-text" x="585.0" y="276.0" font-size="11.5" text-anchor="middle">initial swing</text>
<rect class="d-c" x="520.0" y="293.0" width="130.0" height="30.0" rx="4"/>
<text class="d-text" x="585.0" y="312.0" font-size="11.5" text-anchor="middle">mid-swing</text>
<rect class="d-c" x="520.0" y="329.0" width="130.0" height="30.0" rx="4"/>
<text class="d-text" x="585.0" y="348.0" font-size="11.5" text-anchor="middle">terminal swing</text>
<line class="d-line" x1="250.0" y1="74.0" x2="520.0" y2="74.0"/>
<path class="d-a" d="M266,67 L273,74 L266,81 L259,74 z"/>
<text class="d-text" x="280.0" y="71.0" font-size="11.5" text-anchor="start">IC  initial contact — 주기 시작</text>
<line class="d-line d-dash" x1="250.0" y1="110.0" x2="520.0" y2="110.0"/>
<text class="d-sub d-bad" x="280.0" y="107.0" font-size="11" text-anchor="start">(대응하는 사건 없음: Whittle은 IC를 순간으로 본다)</text>
<line class="d-line" x1="250.0" y1="146.0" x2="520.0" y2="146.0"/>
<path class="d-a" d="M266,139 L273,146 L266,153 L259,146 z"/>
<text class="d-text" x="280.0" y="143.0" font-size="11.5" text-anchor="start">OT  opposite toe off — 반대 발 뜸</text>
<line class="d-line" x1="250.0" y1="182.0" x2="520.0" y2="182.0"/>
<path class="d-a" d="M266,175 L273,182 L266,189 L259,182 z"/>
<text class="d-text" x="280.0" y="179.0" font-size="11.5" text-anchor="start">HR  heel rise — 뒤꿈치 들림</text>
<line class="d-line" x1="250.0" y1="218.0" x2="520.0" y2="218.0"/>
<path class="d-a" d="M266,211 L273,218 L266,225 L259,218 z"/>
<text class="d-text" x="280.0" y="215.0" font-size="11.5" text-anchor="start">OI  opposite initial contact — 반대 발 닿음</text>
<line class="d-line" x1="250.0" y1="254.0" x2="520.0" y2="254.0"/>
<path class="d-a" d="M266,247 L273,254 L266,261 L259,254 z"/>
<text class="d-text" x="280.0" y="251.0" font-size="11.5" text-anchor="start">TO  toe off — 발끝 뜸</text>
<line class="d-line" x1="250.0" y1="290.0" x2="520.0" y2="290.0"/>
<path class="d-a" d="M266,283 L273,290 L266,297 L259,290 z"/>
<text class="d-text" x="280.0" y="287.0" font-size="11.5" text-anchor="start">FA  feet adjacent — 두 발 나란</text>
<line class="d-line" x1="250.0" y1="326.0" x2="520.0" y2="326.0"/>
<path class="d-a" d="M266,319 L273,326 L266,333 L259,326 z"/>
<text class="d-text" x="280.0" y="323.0" font-size="11.5" text-anchor="start">TV  tibia vertical — 정강이 수직</text>
<line class="d-line" x1="250.0" y1="362.0" x2="520.0" y2="362.0"/>
<path class="d-a" d="M266,355 L273,362 L266,369 L259,362 z"/>
<text class="d-text" x="280.0" y="359.0" font-size="11.5" text-anchor="start">IC  다음 initial contact</text>
<path class="d-line" d="M664,78 h6 V250 h-6"/>
<text class="d-text" x="676.0" y="168.0" font-size="11.5" text-anchor="start">stance</text>
<path class="d-line" d="M664,258 h6 V358 h-6"/>
<text class="d-text" x="676.0" y="312.0" font-size="11.5" text-anchor="start">swing</text>
<text class="d-sub" x="14.0" y="380.0" font-size="11.5" text-anchor="start">· Perry phase의 끝 = Whittle 사건(점선 하나만 예외). 이름은 거의 같고, IC를 '기간'으로 세느냐 '순간'으로 보느냐에서 개수가 갈린다.</text>
<text class="d-sub" x="14.0" y="398.0" font-size="11.5" text-anchor="start">· PSw는 발이 바닥에 있지만(stance) Perry 과제로는 SLA다. 구간 %는 Perry 평소 속도 평균([P] 2장), 사건은 [W] 2장 pp.16–18.</text>
<text class="d-sub" x="14.0" y="416.0" font-size="11.5" text-anchor="start">· 같은 순간의 반대 발 phase는 오른발 %에 50 %를 더하거나 빼서 찾는다(두 다리는 반 주기 어긋남).</text>
</svg>
