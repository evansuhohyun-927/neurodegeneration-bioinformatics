<text class="d-text" x="456.0" y="111.0" font-size="11.5" text-anchor="start">heel rocker로 stance 시작</text>
<text class="d-sub" x="456.0" y="125.0" font-size="11" text-anchor="start">착지 충격 줄이기</text>
