<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="functional-tasks-phases-t functional-tasks-phases-d">
<title id="functional-tasks-phases-t">세 기능 과제와 8 phase 지도</title>
<desc id="functional-tasks-phases-d">한 보행 주기(0–100 %GC, 평소 속도의 정상 평균)를 가로 시간축에 놓고 Perry의 8 phase를 한 줄씩 막대로 그렸다. 왼쪽 띠가 세 기능 과제다. weight acceptance(체중 수용)는 IC 0–2 %와 LR 2–12 %, single limb support(한 발 지지)는 MSt 12–31 %와 TSt 31–50 %, swing limb advancement(다리 전진)는 PSw 50–62 %, ISw 62–75 %, MSw 75–87 %, TSw 87–100 %를 묶는다. 맨 위 띠는 stance 0–62 %와 swing 62–100 %다. PSw는 발이 아직 바닥에 있어 stance에 속하지만 과제는 다리 전진에 들어간다. 오른쪽 글은 phase마다 Perry가 정한 기능 목표다. 아래 눈금의 경계 사건은 Whittle의 이름으로 OT 반대 발 떨어짐 12 %, HR 뒤꿈치 들림 31 %, OI 반대 발 닿음 50 %, TO 발끝 떨어짐 62 %, FA 두 발 나란함 75 %, TV 경골 수직 87 %다. 구간과 목표는 Perry &amp; Burnfield 2판 2장, 사건 이름은 Whittle 6판 2장 p.17. 환자의 % 경계는 사건으로 다시 잡아야 한다.</desc>
<text class="d-text d-strong" x="360.0" y="26.0" font-size="15" text-anchor="middle">8 phase를 세 기능 과제로 묶기</text>
<text class="d-sub" x="360.0" y="44.0" font-size="12" text-anchor="middle">Perry 체계 · 평소 속도의 정상 평균(%GC) · 오른쪽은 phase마다의 기능 목표</text>
<rect class="d-node" x="186.0" y="58" width="161.2" height="22" rx="5"/>
<text class="d-text" x="266.6" y="73.0" font-size="12" text-anchor="middle">stance · 발이 바닥 (0–62%)</text>
