<text class="d-text" x="456.0" y="213.0" font-size="11.5" text-anchor="start">지지 발 너머로 몸 전진</text>
<text class="d-sub" x="456.0" y="227.0" font-size="11" text-anchor="start">다리·몸통 안정</text>
<text class="d-text d-strong" x="140.0" y="253.0" font-size="13" text-anchor="start">PSw</text>
<rect class="d-c" x="316.0" y="239" width="31.2" height="20" rx="4"/>
<text class="d-sub" x="352.2" y="253.0" font-size="11" text-anchor="start">50–62%</text>
<text class="d-text" x="456.0" y="247.0" font-size="11.5" text-anchor="start">swing 자세 만들기</text>
<text class="d-sub" x="456.0" y="261.0" font-size="11" text-anchor="start">전진 가속</text>
<text class="d-text d-strong" x="140.0" y="287.0" font-size="13" text-anchor="start">ISw</text>
<rect class="d-c" x="347.2" y="273" width="33.8" height="20" rx="4"/>
<text class="d-sub" x="386.0" y="287.0" font-size="11" text-anchor="start">62–75%</text>
<text class="d-text" x="456.0" y="281.0" font-size="11.5" text-anchor="start">발이 바닥에 걸리지 않게</text>
<text class="d-sub" x="456.0" y="295.0" font-size="11" text-anchor="start">뒤에 있던 다리 앞으로</text>
<text class="d-text d-strong" x="140.0" y="321.0" font-size="13" text-anchor="start">MSw</text>
<rect class="d-c" x="381.0" y="307" width="31.2" height="20" rx="4"/>
<text class="d-sub" x="417.2" y="321.0" font-size="11" text-anchor="start">75–87%</text>
<text class="d-text" x="456.0" y="315.0" font-size="11.5" text-anchor="start">다리 전진</text>
<text class="d-sub" x="456.0" y="329.0" font-size="11" text-anchor="start">발이 바닥에 걸리지 않게</text>
<text class="d-text d-strong" x="140.0" y="355.0" font-size="13" text-anchor="start">TSw</text>
<rect class="d-c" x="412.2" y="341" width="33.8" height="20" rx="4"/>
