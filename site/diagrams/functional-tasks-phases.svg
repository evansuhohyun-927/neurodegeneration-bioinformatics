<text class="d-sub" x="10.0" y="430.0" font-size="11" text-anchor="start">OT 반대 발 떨어짐 · HR 뒤꿈치 들림 · OI 반대 발 닿음 · TO 발끝 떨어짐 · FA 두 발 나란함 · TV 경골 수직 (Whittle 사건 이름)</text>
<text class="d-text d-bad" x="10.0" y="448.0" font-size="11.5" text-anchor="start">빨간 테두리: PSw는 발이 아직 바닥에 있지만(stance) 과제는 다리 전진(SLA)에 들어간다.</text>
<text class="d-sub" x="10.0" y="466.0" font-size="11" text-anchor="start">% 경계는 정상인 평균이다. 환자의 phase는 경계 사건이 언제 일어났는지로 다시 잡는다.</text>
