<rect class="d-a" x="10" y="99" width="118" height="62" rx="8"/>
<text class="d-text d-strong" x="69.0" y="121.0" font-size="11.5" text-anchor="middle">weight acceptance</text>
<text class="d-text" x="69.0" y="135.0" font-size="10.5" text-anchor="middle">체중 수용</text>
<text class="d-sub" x="69.0" y="149.0" font-size="10.5" text-anchor="middle">0–12%</text>
