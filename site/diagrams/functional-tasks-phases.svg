<text class="d-text" x="456.0" y="145.0" font-size="11.5" text-anchor="start">충격 흡수 · 체중 지지 안정</text>
<text class="d-sub" x="456.0" y="159.0" font-size="11" text-anchor="start">전진을 멈추지 않기</text>
<text class="d-text d-strong" x="140.0" y="185.0" font-size="13" text-anchor="start">MSt</text>
<rect class="d-b" x="217.2" y="171" width="49.4" height="20" rx="4"/>
<text class="d-text" x="241.9" y="185.0" font-size="11" text-anchor="middle">12–31%</text>
<text class="d-text" x="456.0" y="179.0" font-size="11.5" text-anchor="start">멈춰 있는 발 위로 전진</text>
<text class="d-sub" x="456.0" y="193.0" font-size="11" text-anchor="start">다리·몸통 안정</text>
<text class="d-text d-strong" x="140.0" y="219.0" font-size="13" text-anchor="start">TSt</text>
<rect class="d-b" x="266.6" y="205" width="49.4" height="20" rx="4"/>
