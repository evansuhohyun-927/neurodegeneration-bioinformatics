<rect class="d-c" x="392.0" y="440.0" width="16.0" height="11.0" rx="2"/>
<text class="d-text" x="412.0" y="450.0" font-size="10.5" text-anchor="start">swing에서 다리 들기·전진</text>
<circle class="d-node d-bad" cx="586.0" cy="446.0" r="3.6"/>
<text class="d-text" x="594.0" y="450.0" font-size="10.5" text-anchor="start">가장 센 시점(대략)</text>
<text class="d-text" x="10.0" y="474.0" font-size="10.5" text-anchor="start">① LR에 무릎을 버티는 것은 광근이다. 대퇴직근은 PSw–ISw에 짧게, 그것도 일부 사람에게만 나온다.</text>
<text class="d-text" x="10.0" y="491.0" font-size="10.5" text-anchor="start">② 광근이 꺼진 뒤(약 20 %) MSt–TSt의 무릎은 GRF 정렬과 가자미근의 정강이 제동으로 안정된다.</text>
<text class="d-text" x="10.0" y="508.0" font-size="10.5" text-anchor="start">③ PSw에 종아리 근육은 꺼지는데 발목은 가장 빠르게 족저굴곡한다. Perry는 이를 건의 탄성 반동으로 본다.</text>
<text class="d-text" x="10.0" y="525.0" font-size="10.5" text-anchor="start">④ TSw에는 햄스트링(감속)과 광근(신전 마무리)이 함께 켜진다. 정상적인 동시 활성이다.</text>
<text class="d-sub" x="10.0" y="542.0" font-size="10.5" text-anchor="start">Perry &amp; Burnfield 2판 4–6·9장의 정상 평균(fine-wire EMG)에서 고른 값으로 새로 그린 도식. 사람·속도에 따라 다르다.</text>
</svg>
