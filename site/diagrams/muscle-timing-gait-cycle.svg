<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556" role="img" aria-labelledby="muscle-timing-gait-cycle-t muscle-timing-gait-cycle-d">
<title id="muscle-timing-gait-cycle-t">보행 주기 동안 주요 근육의 활동 구간</title>
<desc id="muscle-timing-gait-cycle-d">가로축은 오른발 initial contact부터 다음 initial contact까지의 보행 주기(0–100 %GC)이고 맨 위에 Perry의 8 phase 띠(IC 0–2, LR 2–12, MSt 12–31, TSt 31–50, PSw 50–62, ISw 62–75, MSw 75–87, TSw 87–100 %)가 있다. 그 아래 근육 열 개가 켜지는 구간을 막대로, 가장 센 시점을 점으로 표시했다. 전경골근: 56 %에 켜져 다음 주기 13 %까지(swing에 발 들기, LR에 발 내리기 제동), 최대는 IC 무렵. 광근(vastii): 89 %에 켜져 20 %까지, 최대 약 6 %. 대퇴직근: 57–65 %에만, 그것도 20명 중 7명에서. 하부 대둔근: 95 %에서 10 %까지. 중둔근: 96 %에서 29 %까지, 최대 약 6 %. 가자미근: 7–52 %, 최대 약 43 %. 비복근: 9–50 %, 최대 약 40 %. 반막양근(햄스트링 대표): 81 %에서 다음 주기 15 %까지, 최대는 TSw. 대퇴이두근 단두: 65–82 %. 장골근: 63–74 %(평소 속도에서는 자주 쉼). 색은 역할을 나눈다: stance에서 제동·지지하는 구간, TSw에 미리 켜져 다리를 감속하고 접지를 준비하는 구간, swing에서 다리를 들고 앞으로 보내는 구간. 아래 메모는 네 가지를 짚는다: LR의 무릎은 대퇴직근이 아니라 광근이 버틴다, 광근이 꺼진 뒤 MSt–TSt의 무릎은 정렬과 가자미근으로 안정된다, PSw에 종아리 근육 EMG가 꺼지는데도 발목이 빠르게 족저굴곡하는 것을 Perry는 건의 탄성 반동으로 해석한다, TSw의 햄스트링–광근 동시 활성은 정상이다. 값은 Perry &amp; Burnfield 2판 4–6장과 9장의 정상 성인 평균(fine-wire EMG)에서 고른 대표값이며 사람과 걷는 속도에 따라 달라진다.</desc>
<text class="d-text d-strong" x="360.0" y="22.0" font-size="15" text-anchor="middle">보행 주기 동안 주요 근육이 켜지는 구간 (설명용 대표값)</text>
