<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="reproducibility-t reproducibility-d">
<title id="reproducibility-t">재현성의 네 가지 재료</title>
<desc id="reproducibility-d">재현성을 위해 남길 네 가지: 라이브러리 버전(environment.yml, 실험실의 시약 lot 번호), 실행 순서(Restart Kernel and Run All, 프로토콜 순서), 데이터 받기(URL·버전·폴더를 data/README.md에, 시료 출처), random seed(SEED = 42, 무작위 배정표). 네 가지가 있으면 다른 사람이나 6개월 뒤의 내가 같은 데이터와 코드로 같은 숫자와 그림을 다시 얻는다.</desc>
<defs>
<marker id="reproducibility-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="d-a" x="16" y="20" width="154" height="150" rx="8"/>
<text class="d-sub" x="93" y="44" font-size="12" text-anchor="middle">실험실: 시약 lot 번호</text>
<line class="d-line" x1="28" y1="56" x2="158" y2="56"/>
<text class="d-text d-strong" x="93" y="84" font-size="15" text-anchor="middle">라이브러리 버전</text>
<text class="d-text" x="93" y="112" font-size="13" text-anchor="middle">environment.yml</text>
<text class="d-sub" x="93" y="136" font-size="12" text-anchor="middle">실제 버전 목록도</text>
<text class="d-sub" x="93" y="154" font-size="12" text-anchor="middle">README에 기록</text>
<rect class="d-b" x="194" y="20" width="154" height="150" rx="8"/>
<text class="d-sub" x="271" y="44" font-size="12" text-anchor="middle">실험실: 프로토콜 순서</text>
<line class="d-line" x1="206" y1="56" x2="336" y2="56"/>
<text class="d-text d-strong" x="271" y="84" font-size="15" text-anchor="middle">실행 순서</text>
<text class="d-text" x="271" y="112" font-size="13" text-anchor="middle">Restart &amp; Run All</text>
<text class="d-sub" x="271" y="136" font-size="12" text-anchor="middle">위에서 아래로</text>
<text class="d-sub" x="271" y="154" font-size="12" text-anchor="middle">오류 없이 같은 그림</text>
<rect class="d-c" x="372" y="20" width="154" height="150" rx="8"/>
<text class="d-sub" x="449" y="44" font-size="12" text-anchor="middle">실험실: 시료 출처</text>
<line class="d-line" x1="384" y1="56" x2="514" y2="56"/>
<text class="d-text d-strong" x="449" y="84" font-size="15" text-anchor="middle">데이터 받기</text>
<text class="d-text" x="449" y="112" font-size="13" text-anchor="middle">URL·버전·폴더</text>
<text class="d-sub" x="449" y="136" font-size="12" text-anchor="middle">data/README.md</text>
<text class="d-sub" x="449" y="154" font-size="12" text-anchor="middle">데이터는 Git에 안 넣음</text>
<rect class="d-d" x="550" y="20" width="154" height="150" rx="8"/>
<text class="d-sub" x="627" y="44" font-size="12" text-anchor="middle">실험실: 무작위 배정표</text>
<line class="d-line" x1="562" y1="56" x2="692" y2="56"/>
<text class="d-text d-strong" x="627" y="84" font-size="15" text-anchor="middle">random seed</text>
<text class="d-text" x="627" y="112" font-size="13" text-anchor="middle">SEED = 42</text>
<text class="d-sub" x="627" y="136" font-size="12" text-anchor="middle">random_state=SEED</text>
<text class="d-sub" x="627" y="154" font-size="12" text-anchor="middle">노트북 맨 위</text>
<line class="d-line" x1="93" y1="170" x2="236" y2="228" marker-end="url(#reproducibility-arrow)"/>
<line class="d-line" x1="271" y1="170" x2="316" y2="228" marker-end="url(#reproducibility-arrow)"/>
<line class="d-line" x1="449" y1="170" x2="404" y2="228" marker-end="url(#reproducibility-arrow)"/>
<line class="d-line" x1="627" y1="170" x2="484" y2="228" marker-end="url(#reproducibility-arrow)"/>
<rect class="d-node" x="160" y="230" width="400" height="72" rx="8"/>
<text class="d-text d-strong d-good" x="360" y="259" font-size="15" text-anchor="middle">✓ 같은 데이터 + 같은 코드 → 같은 숫자·그림</text>
<text class="d-sub" x="360" y="284" font-size="12" text-anchor="middle">다른 사람도, 6개월 뒤의 나도</text>
<text class="d-sub" x="360" y="330" font-size="12" text-anchor="middle">seed 고정은 같은 숫자를 다시 얻는 것이지, 결과가 옳다는 보증은 아니다</text>
</svg>
